[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "settleezy-cofounder"
version = "0.1.0"
description = "Personal assistant + growth co-founder for Settleezy, built to run alongside OpenJarvis"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "msal>=1.28",
  "anthropic>=1.12",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp>=2,<3",
]

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.0",
  "openwakeword>=0.6",
  "sounddevice>=0.4",
  "numpy>=1.26",
  "pyttsx3>=2.90",
]
brain = [
  "fastembed>=0.5",   # multilingual memory embeddings on the CPU (ONNX)
]
notify = [
  "win11toast>=0.35; sys_platform == 'win32'",   # Windows pop-ups
  "pywebpush>=2.0",                              # push to your phone (installed app)
]
widget = ["pywebview>=5.0"]                      # always-on-top Setz window
render = ["playwright>=1.44"]
dev = ["pytest>=8"]

[project.scripts]
sz = "settleezy_cofounder.cli:main"

[tool.setuptools.packages.find]
include = ["settleezy_cofounder*"]

[tool.setuptools.package-data]
settleezy_cofounder = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
