name: Check kit

on:
  pull_request:
  push:
    branches: [claude/seo-student-acquisition-ub3og0, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_kit.py
