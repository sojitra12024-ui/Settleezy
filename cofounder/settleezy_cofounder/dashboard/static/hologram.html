<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis Hologram</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; --bg: #04080d; --text: #d8f8ff; --muted: #6fa9b8; --accent: #5ef2ff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 40%, #0a1a26 0%, var(--bg) 70%); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
.hud { position: fixed; left: 0; right: 0; display: flex; justify-content: space-between; padding: 18px 24px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.top { top: 0; } .state b { color: var(--accent); font-weight: 600; }
.caption { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); width: min(820px, calc(100% - 32px)); text-align: center;
  font-size: clamp(15px, 2.2vw, 21px); text-shadow: 0 0 18px rgba(94,242,255,.45); min-height: 3em; transition: opacity .3s; }
.caption .you { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
a { color: var(--muted); }
</style>
</head>
<body>
<canvas id="holo" aria-label="Voice assistant hologram"></canvas>
<div class="hud top"><span>Settleezy · Jarvis</span><span class="state">state: <b id="state">idle</b></span><a href="/">dashboard</a></div>
<div class="caption" id="caption"></div>
<script src="/static/hologram.js"></script>
<script>
const holo = new Hologram(document.getElementById("holo"));
const cap = document.getElementById("caption"), st = document.getElementById("state");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
connectVoiceStream(holo, (ev) => {
  st.textContent = ev.state;
  if (ev.state === "thinking" && ev.text) cap.innerHTML = `<span class="you">You</span>${esc(ev.text)}`;
  else if (ev.state === "speaking" && ev.text) cap.textContent = ev.text;
  else if (ev.state === "listening") cap.innerHTML = `<span class="you">Listening…</span>`;
});
</script>
</body>
</html>
